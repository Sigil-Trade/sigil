# Nightly Extended Fuzz — 50K iterations (vs 1K on every PR)
#
# Catches subtle invariant violations that short fuzz runs miss.
# Same harness as ci.yml fuzz-test job, just more iterations + longer timeout.
#
# Schedule: 3 AM UTC nightly (1 hour after devnet tests)

name: Nightly Fuzz (Extended)

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: true

jobs:
  extended-fuzz:
    name: Extended Fuzz (Trident, 50K iterations)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLANA_VERSION: "v2.1.14"
      ANCHOR_VERSION: "0.32.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry + build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            trident-tests/target
          key: trident-${{ runner.os }}-${{ hashFiles('trident-tests/Cargo.lock') }}
          restore-keys: trident-${{ runner.os }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      # Trident loads the program-under-test as an SBF .so at runtime (see
      # trident-tests/Trident.toml [[fuzz.programs]]). Without a freshly-built
      # sigil.so the harness fuzzes nothing — mirror the ci.yml fuzz-test job.
      - name: Cache Solana toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/solana
          key: solana-${{ runner.os }}-${{ runner.arch }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$SOLANA_BIN/solana" ]; then
            for attempt in 1 2 3 4 5; do
              sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_VERSION }}/install)" && break
              echo "Solana install attempt $attempt failed; retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
          fi
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked --force
          fi

      - name: Build program (.so for the fuzz harness to load)
        run: anchor build --no-idl

      - name: Restore committed IDL
        run: git checkout -- target/idl/ target/types/

      - name: Compile fuzz harness
        working-directory: trident-tests
        run: cargo build --release --bin fuzz_0

      - name: Run extended fuzz (50K iterations)
        working-directory: trident-tests
        env:
          # Without this, a panicking invariant still exits 0 — the run would be
          # hollow (matches the ci.yml fuzz-test job).
          TRIDENT_WITH_EXIT_CODE: "1"
        run: |
          timeout 2400 ./target/release/fuzz_0 || EXIT=$?
          if [ "${EXIT:-0}" -eq 124 ]; then
            echo "::error::Extended fuzz timed out after 40 minutes"
            exit 1
          elif [ "${EXIT:-0}" -ne 0 ]; then
            echo "::error::Extended fuzz found invariant violations!"
            exit 1
          fi
          echo "Extended fuzz completed successfully (50K iterations)"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fuzz-crashes
          path: |
            trident-tests/trident-crashes/
            trident-tests/crash-*
          retention-days: 90
          if-no-files-found: ignore
