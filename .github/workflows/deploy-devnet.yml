# Deploy to Devnet — Auto-deploy program + IDL after Rust changes merge to main
#
# Triggers:
#   - Push to main (path-filtered: programs/**, Anchor.toml)
#   - Manual dispatch (for re-deploy after devnet reset or debugging)
#
# Flow: build → deploy binary → close+init IDL → chain devnet tests
#
# IDL Strategy: Always `close` then `init` (never `upgrade`).
# Anchor's `idl upgrade` fails with RequireGteViolated when the IDL grows
# beyond the initial account allocation. close+init handles any size change.
#
# Requires GitHub environment "devnet" with secrets:
#   - DEVNET_DEPLOY_KEYPAIR: upgrade authority keypair (JSON array)
#   - DEVNET_RPC_URL: dedicated devnet RPC endpoint (e.g. Helius). NEVER a public
#     endpoint — public RPCs throttle the deploy's buffer-write burst, leaving an
#     incomplete buffer that the upgrade rejects with "invalid account data for
#     instruction". A startup guard fails the deploy if this is empty or public.
#   - DEVNET_WALLET_KEYPAIR: test wallet keypair (passed to devnet-test.yml)

name: Deploy to Devnet

on:
  push:
    branches: [main]
    paths:
      - "programs/sigil/src/**"
      - "Anchor.toml"
  workflow_dispatch: # Manual trigger for devnet reset recovery or debugging

# Never cancel a deploy mid-flight — incomplete deploys waste SOL
# Shared with devnet-test.yml (group: devnet-shared-wallet) so a push-triggered
# deploy and a nightly test run serialize on the one funded devnet wallet
# instead of racing it. Same string in both workflows is load-bearing.
concurrency:
  group: devnet-shared-wallet
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLANA_VERSION: "v2.1.14"
  ANCHOR_VERSION: "0.32.1"
  NODE_VERSION: "24"
  PROGRAM_ID: "7FtAXUcrann7P5HoLG7vnWcVpozwj9nqcNm6bPwA1wuK"

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Build program, deploy binary + IDL, verify health
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: devnet
    timeout-minutes: 20
    steps:
      # Fail-closed RPC guard — runs first (before the ~4-min build) so a
      # missing/public RPC fails fast with a clear message instead of silently
      # deploying on a public endpoint and corrupting the buffer write.
      - name: Guard — require a dedicated (non-public) devnet RPC
        env:
          RPC: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          if [ -z "$RPC" ]; then
            echo "::error::DEVNET_RPC_URL is empty — refusing to deploy. Set it to your dedicated (e.g. Helius) devnet endpoint: gh secret set DEVNET_RPC_URL --repo Sigil-Trade/sigil"
            exit 1
          fi
          case "$RPC" in
            *api.devnet.solana.com*|*api.testnet.solana.com*|*api.mainnet-beta.solana.com*)
              echo "::error::DEVNET_RPC_URL points at a PUBLIC Solana RPC. Program deploys must use a dedicated RPC — public endpoints throttle the buffer-write burst and leave an incomplete buffer that the upgrade rejects ('invalid account data for instruction'). Refusing to deploy."
              exit 1 ;;
          esac
          echo "DEVNET_RPC_URL is a dedicated endpoint — OK to deploy."

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry + build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: deploy-${{ runner.os }}-${{ hashFiles('programs/sigil/Cargo.lock') }}
          restore-keys: deploy-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked --force
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build program (devnet feature)
        run: anchor build --no-idl

      - name: Restore committed IDL
        run: git checkout -- target/idl/ target/types/

      - name: Configure deploy wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          echo '${{ secrets.DEVNET_DEPLOY_KEYPAIR }}' > "$HOME/.config/solana/id.json"
          solana config set \
            --url "${{ secrets.DEVNET_RPC_URL }}" \
            --keypair "$HOME/.config/solana/id.json" \
            > /dev/null 2>&1

      - name: Balance gate
        run: |
          BAL=$(solana balance | awk '{print $1}')
          BAL_INT=$(echo "$BAL" | awk '{print int($1)}')
          echo "Deploy wallet balance: $BAL SOL"
          if [ "$BAL_INT" -lt 3 ]; then
            echo "::error::Deploy wallet balance too low: ${BAL} SOL (need >= 3 SOL)"
            echo "Top up: solana airdrop 2 $(solana address) --url https://api.devnet.solana.com"
            exit 1
          fi
          if [ "$BAL_INT" -lt 10 ]; then
            echo "::warning::Deploy wallet balance is low: ${BAL} SOL. Consider topping up."
          fi

      - name: Deploy program binary
        run: |
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Deploy attempt $i/$MAX_RETRIES"
            if solana program deploy target/deploy/sigil.so \
                --program-id ${{ env.PROGRAM_ID }} \
                --upgrade-authority "$HOME/.config/solana/id.json" \
                --with-compute-unit-price 1000 \
                --max-sign-attempts 50; then
              echo "Program deploy succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Program deploy failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Deploy failed, waiting 30s before retry..."
            sleep 30
          done

      - name: Wait for program upgrade to propagate
        # solana program deploy returns once the tx is finalized at the
        # submitting RPC, but RPC nodes queried by subsequent steps may
        # briefly still see the OLD executable slot. If anchor idl close
        # fires during that window the simulator returns:
        #   Error: Unsupported program id; Program is not deployed
        # The old fallthrough swallowed that error and anchor idl init
        # then hit "already in use" — misleading signal for an RPC race.
        # Poll until the RPC reports a healthy program before proceeding.
        run: |
          echo "Polling for program upgrade propagation (max 60s)..."
          for i in $(seq 1 12); do
            if solana program show ${{ env.PROGRAM_ID }} \
                --url "${{ secrets.DEVNET_RPC_URL }}" > /dev/null 2>&1; then
              echo "Program executable is live (took ~$((i * 5))s)"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "::error::Program still not visible to RPC after 60s — aborting IDL deploy"
              exit 1
            fi
            echo "  attempt $i/12 — program not yet visible, sleeping 5s"
            sleep 5
          done

      - name: Deploy IDL (close + init strategy)
        run: |
          # Always close then init — never use anchor idl upgrade.
          # Upgrade fails with RequireGteViolated when IDL grows beyond
          # the initial account allocation (e.g., 9498 < 11675 bytes).
          #
          # Two failure modes this handles:
          #  1. NO existing IDL (first deploy / previous close succeeded):
          #     anchor idl close exits non-zero with AccountNotInitialized
          #     or similar. Acceptable — fall through to init.
          #  2. Transient RPC lag / "Program is not deployed":
          #     Previous implementation fell through on ALL close errors,
          #     hiding the race and surfacing a misleading "already in use"
          #     on init. Now we retry close with backoff before falling
          #     through, and only do so on explicit account-absent signals.

          echo "Closing existing IDL account (if any)..."
          CLOSE_MAX_RETRIES=5
          CLOSE_SUCCESS=false
          for i in $(seq 1 $CLOSE_MAX_RETRIES); do
            echo "  close attempt $i/$CLOSE_MAX_RETRIES"
            CLOSE_OUTPUT=$(anchor idl close ${{ env.PROGRAM_ID }} \
              --provider.cluster "${{ secrets.DEVNET_RPC_URL }}" 2>&1 || true)
            echo "$CLOSE_OUTPUT"

            if echo "$CLOSE_OUTPUT" | grep -qiE "idl closed|successfully closed"; then
              CLOSE_SUCCESS=true
              echo "IDL close succeeded on attempt $i"
              break
            fi
            if echo "$CLOSE_OUTPUT" | grep -qiE "AccountNotInitialized|account does not exist|no such account"; then
              echo "No existing IDL to close. Proceeding to init."
              break
            fi
            if [ "$i" -eq "$CLOSE_MAX_RETRIES" ]; then
              echo "::error::IDL close failed after $CLOSE_MAX_RETRIES attempts"
              echo "::error::Last error: $CLOSE_OUTPUT"
              exit 1
            fi
            echo "  transient close error, sleeping 15s before retry..."
            sleep 15
          done

          # Brief settle-time between close finalization and init submission.
          # Devnet RPC commitment level can lag a few slots; init hitting
          # "already in use" against an account that just closed is typical.
          if [ "$CLOSE_SUCCESS" = "true" ]; then
            echo "Waiting 10s for close to propagate before init..."
            sleep 10
          fi

          echo "Initializing IDL account with current IDL..."
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "IDL init attempt $i/$MAX_RETRIES"
            if anchor idl init \
                --filepath target/idl/sigil.json \
                ${{ env.PROGRAM_ID }} \
                --provider.cluster "${{ secrets.DEVNET_RPC_URL }}"; then
              echo "IDL init succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::IDL init failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "IDL init failed, waiting 15s before retry..."
            sleep 15
          done

      - name: Verify deployment
        run: |
          echo "=== Program Verification ==="
          solana program show ${{ env.PROGRAM_ID }}

          echo ""
          echo "=== IDL Verification ==="
          IDL_JSON=$(anchor idl fetch ${{ env.PROGRAM_ID }} --provider.cluster "${{ secrets.DEVNET_RPC_URL }}")
          IX_COUNT=$(echo "$IDL_JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('instructions',[])))")
          ACC_COUNT=$(echo "$IDL_JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('accounts',[])))")
          ERR_COUNT=$(echo "$IDL_JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('errors',[])))")
          echo "On-chain IDL: $IX_COUNT instructions, $ACC_COUNT accounts, $ERR_COUNT errors"

          # Sanity check — IDL should have our known instruction count
          if [ "$IX_COUNT" -lt 20 ]; then
            echo "::error::IDL verification failed: only $IX_COUNT instructions (expected 29)"
            exit 1
          fi

      - name: Save deploy metadata
        run: |
          BINARY_HASH=$(sha256sum target/deploy/sigil.so | cut -d' ' -f1)
          cat > deploy-metadata.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "binary_hash": "$BINARY_HASH",
            "binary_size": $(wc -c < target/deploy/sigil.so),
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed_by": "github-actions",
            "anchor_version": "${{ env.ANCHOR_VERSION }}",
            "solana_cli": "${{ env.SOLANA_VERSION }}",
            "program_id": "${{ env.PROGRAM_ID }}",
            "wallet_balance_after": "$(solana balance | awk '{print $1}')"
          }
          EOF
          cat deploy-metadata.json

      - name: Upload deploy metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devnet-deploy-metadata
          path: deploy-metadata.json
          retention-days: 90

      - name: Cleanup deploy wallet
        if: always()
        run: rm -f "$HOME/.config/solana/id.json"

  # ────────────────────────────────────────────────────────────────
  # Job 2: Verify deployed binary matches source (solana-verify)
  # ────────────────────────────────────────────────────────────────
  verify-program:
    name: Verify Program Binary
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      - name: Verify deployed program matches source
        run: |
          set -e
          # Reproducible docker build, verified against the ON-CHAIN program.
          # The on-chain fetch is READ-ONLY and uses PUBLIC devnet on purpose:
          # solana-verify mangles Helius's query-param API key (?api-key=) and
          # 401s on it. The #356 dedicated-RPC guard targets the DEPLOY job's
          # buffer-write burst (which public RPCs throttle) — a single read-only
          # program fetch is safe on public devnet. The deploy job itself still
          # uses the guarded dedicated RPC.
          solana-verify verify-from-repo \
            https://github.com/Sigil-Trade/sigil \
            --program-id 7FtAXUcrann7P5HoLG7vnWcVpozwj9nqcNm6bPwA1wuK \
            --library-name sigil \
            --mount-path . \
            --url https://api.devnet.solana.com

  # ────────────────────────────────────────────────────────────────
  # Job 3: Devnet tests (post-deploy)
  #
  # Re-enabled 2026-06-10: the 2026-04-03 blocker (raw SPL Token Transfer
  # mock-spend, correctly rejected by the instruction scan with
  # UnauthorizedTokenTransfer 6038) is resolved — spending sandwiches now
  # route through the deployed mock-defi fixture program's
  # drain_via_delegation/open_position CPIs, OPERATOR seating uses the real
  # F-Q6 queue→600s→apply path, and initialize_vault binds the live
  # execution slot. ~110 min runtime (one real 600s wait per file).
  # ────────────────────────────────────────────────────────────────
  test:
    name: Devnet Tests (post-deploy)
    needs: deploy
    uses: ./.github/workflows/devnet-test.yml
    # Forces devnet-test.yml's concurrency to a per-run group so this called
    # child never contends for the 'devnet-shared-wallet' lock the parent (this
    # deploy) already holds — prevents the manual-dispatch self-deadlock.
    with:
      called-by-deploy: true
    secrets: inherit
