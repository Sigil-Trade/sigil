# Devnet Tests — Real Solana devnet integration tests
#
# Triggers:
#   - Called by deploy-devnet.yml after program + IDL deploy (primary)
#   - Nightly at 2 AM UTC (catches network/RPC drift)
#   - Manual dispatch (optional: specific test file or verbose mode)
#
# NOTE: No longer triggers on push to main for programs/** paths.
# The deploy-devnet.yml workflow handles: build → deploy → test (chained).
# This prevents tests from running against a stale program binary.
#
# 140 tests across 9 files. Costs SOL — never runs on PRs.
#
# RUNTIME: ~110 min. F-Q6 forbids instant OPERATOR grants on single-key
# vaults; devnet has no clock cheatcodes, so each file pays one REAL 600s
# queue→apply wait in its before() (grants are batched per file). 7 of the
# 8 files carry a wait. This is the cost of testing the genuine on-chain
# timelock path — do not "optimize" it away by weakening the program.

name: Devnet Tests

on:
  workflow_call: # Called by deploy-devnet.yml after successful deploy
  # Re-enabled 2026-06-10: fixture sweep complete — V2 sandwiches route
  # through the deployed mock-defi fixture program (2heRcf...), OPERATOR
  # seating uses the real queue→600s→apply path, and initialize_vault binds
  # the live execution slot. See tests/helpers/devnet-setup.ts.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Specific test file (e.g., devnet-smoke.ts) or "all"'
        required: false
        default: "all"

# Serialize devnet wallet use across runs. The nightly cron + manual dispatch
# here, and the push-triggered deploy in deploy-devnet.yml (which redeploys
# sigil.so + spends the same DEVNET_WALLET_KEYPAIR), MUST queue on one shared
# group ("devnet-shared-wallet") so they never race the wallet nonce / collide
# on the deterministic per-file vault IDs.
#
# EXCEPTION — workflow_call: when deploy-devnet.yml CALLS this workflow, the
# parent run ALREADY holds "devnet-shared-wallet" for the whole chain, so the
# called child must NOT also request it or it self-deadlocks waiting on the slot
# its own parent holds (the prior failure mode). A called run inherits the
# caller's event (push), so only the direct schedule/dispatch triggers take the
# shared lock; the called child uses a unique per-run group and relies on the
# parent's lock to serialize the chain against the nightly.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'devnet-shared-wallet' || format('devnet-test-{0}', github.run_id) }}
  cancel-in-progress: false

# M6: Least-privilege — only read repo contents
permissions:
  contents: read

jobs:
  devnet-test:
    runs-on: ubuntu-latest
    # ~110 min runtime: 7 files × one real 600s OPERATOR-seating wait each
    # (F-Q6 single-key floor) + setup/exec. Margin for devnet RPC weather.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The devnet-*.ts suites import strict error helpers from the local
      # tests/helpers/strict-errors mirror (NOT @usesigil/kit/testing — that
      # ESM subpath can't be require()'d under CJS ts-mocha). The kit build is
      # still required for the separate Kit SDK dashboard-integration step
      # below, whose imports resolve to sdk/kit/dist/ (built here).
      - name: Build kit SDK (required for the Kit SDK devnet step below)
        run: pnpm --filter @usesigil/kit run build

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure devnet wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          echo '${{ secrets.DEVNET_WALLET_KEYPAIR }}' > "$HOME/.config/solana/id.json"
          solana config set --url "${{ secrets.DEVNET_RPC_URL }}" --keypair "$HOME/.config/solana/id.json" > /dev/null 2>&1

      - name: Fund wallet (public faucet)
        run: |
          echo "Current balance: $(solana balance)"
          echo "Requesting airdrops from public faucet..."
          for i in $(seq 1 6); do
            BAL=$(solana balance | awk '{print int($1)}')
            if [ "$BAL" -ge 5 ]; then
              echo "Balance is ${BAL} SOL (>= 5). Sufficient."
              break
            fi
            echo "Attempt $i/6 — balance: ${BAL} SOL"
            if solana airdrop 0.5 --url https://api.devnet.solana.com; then
              echo "Success. Waiting 30s..."
              sleep 30
            else
              echo "Failed (likely rate limit). Waiting 120s..."
              sleep 120
            fi
          done
          echo "Final balance: $(solana balance)"

      - name: Balance gate
        run: |
          BAL=$(solana balance | awk '{print int($1)}')
          if [ "$BAL" -lt 1 ]; then
            echo "::error::Insufficient SOL for devnet tests. Balance: $(solana balance). Need >= 1 SOL."
            echo "Top up manually: solana airdrop 2 --url https://api.devnet.solana.com"
            echo "Or run the Devnet SOL Funder workflow manually."
            exit 1
          fi
          echo "Balance gate passed: $(solana balance)"

      - name: Export wallet path
        run: |
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
          echo "ANCHOR_PROVIDER_URL=${{ secrets.DEVNET_RPC_URL }}" >> "$GITHUB_ENV"

      # Preflight: the spending suites route every V2 sandwich through the
      # mock-defi fixture program (open_position / drain_via_delegation). It is
      # deployed MANUALLY to devnet (not built in CI; keypair not in-repo), so
      # fail fast with an actionable message rather than letting 7 of 8 files
      # revert deep in a ~110-min run if the fixture is ever closed/reset.
      - name: Verify mock-defi fixture is deployed
        run: |
          MOCK_DEFI=2heRcfqPUcSiWpH1rAp2Zf4c4ZxfKmKaaVbJWGRa7Qm6
          if ! solana program show "$MOCK_DEFI" --url "${{ secrets.DEVNET_RPC_URL }}" > /dev/null 2>&1; then
            echo "::error::mock-defi fixture $MOCK_DEFI is not deployed on devnet."
            echo "The devnet spending suites require it. Redeploy from tests/fixtures/mock-defi.so:"
            echo "  solana program deploy tests/fixtures/mock-defi.so --program-id <mock-defi keypair> -u devnet"
            echo "(rebuild the .so first if its declare_id changed: scripts/rebuild-mock-defi.sh)"
            exit 1
          fi
          echo "mock-defi fixture present: $MOCK_DEFI"

      - name: Run devnet tests
        env:
          TEST_FILTER: ${{ github.event.inputs.test-filter || 'all' }}
          # Node 23+ enables --experimental-strip-types by default, which
          # conflicts with ts-node's CJS loader for .ts imports. Disable it.
          NODE_OPTIONS: "--no-experimental-strip-types"
        run: |
          # -t 1800000 (30 min): the mocha timeout also bounds before() hooks,
          # which carry vault-pool setup + ONE real 600s OPERATOR-seating wait
          # (routing's 12-vault pool runs ~17 min end to end).
          FILTER="$TEST_FILTER"
          if [ "$FILTER" != "all" ] && [ -f "tests/$FILTER" ]; then
            echo "Running single test file: tests/$FILTER"
            npx ts-mocha -p ./tsconfig.json -t 1800000 "tests/$FILTER"
          else
            echo "Running all devnet tests (8 files)"
            npx ts-mocha -p ./tsconfig.json -t 1800000 \
              tests/devnet-smoke.ts \
              tests/devnet-sessions.ts \
              tests/devnet-fees.ts \
              tests/devnet-security.ts \
              tests/devnet-spending.ts \
              tests/devnet-transfers.ts \
              tests/devnet-timelock.ts \
              tests/devnet-routing.ts
          fi

      - name: Run Kit SDK devnet tests (dashboard, lifecycle, composed-tx)
        working-directory: sdk/kit
        env:
          ANCHOR_PROVIDER_URL: ${{ secrets.DEVNET_RPC_URL }}
        # 20-min per-hook timeout: lifecycle + composed-tx each provision a
        # FULL_CAPABILITY (operator) vault, which V2 (F-Q6) routes through the
        # queue → on-chain 600s single-key timelock floor → apply path — one
        # real ~600s cluster-clock wait per file. dashboard-integration uses an
        # observer-capability vault (instant) so it finishes fast under the same
        # ceiling.
        run: |
          npx mocha --require tsx \
            tests/devnet/dashboard-integration.test.ts \
            tests/devnet/lifecycle.test.ts \
            tests/devnet/composed-tx.test.ts \
            --timeout 1200000

      - name: Cleanup wallet
        if: always()
        run: rm -f "$HOME/.config/solana/id.json"
