# Automated release workflow using Changesets.
#
# Dual behavior on push to main:
#   1. Changeset files exist  → opens/updates a "Version Packages" PR
#      (bumps versions, generates changelogs, deletes consumed changesets)
#   2. No changeset files     → publishes changed packages to npm
#      (runs after the Version Packages PR is merged)
#
# Two-job design:
#   - check:   Fast (checkout only, no approval) — detects if release is needed
#   - release: Gated by `environment: production` — only runs when check says yes
#
# Short-circuits when there are no changesets AND the commit is not a
# "version packages" merge — avoids wasting CI minutes on non-release pushes.
#
# Uses npm OIDC Trusted Publishing (provenance) — no stored npm token.
# Each @usesigil package must have Trusted Publishing configured
# on npmjs.com → Package Settings → Publishing access → Trusted Publishers.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger for retrying failed publishes

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Never cancel a publish in progress

permissions:
  contents: write # Push tags, update Version Packages PR
  pull-requests: write # Open/update the Version Packages PR
  id-token: write # npm OIDC Trusted Publishing (provenance)
  actions: read # lockstep guard reads the latest 'Deploy to Devnet' run status

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Fast check — no environment gate, runs immediately
  # ──────────────────────────────────────────────────────────────
  check:
    name: Check Release
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    outputs:
      needed: ${{ steps.release-check.outputs.needed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if release is needed
        id: release-check
        run: |
          # Check for changeset files (excluding README.md)
          CHANGESET_FILES=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)

          # Check if any local package version is ahead of npm (unpublished).
          # This catches version packages merges regardless of commit depth.
          UNPUBLISHED=false
          for pkg_json in packages/*/package.json sdk/*/package.json; do
            [ -f "$pkg_json" ] || continue
            PKG_NAME=$(node -p "require('./$pkg_json').name" 2>/dev/null) || continue
            LOCAL_VER=$(node -p "require('./$pkg_json').version" 2>/dev/null) || continue
            NPM_VER=$(npm view "$PKG_NAME" version 2>/dev/null) || continue
            if [ "$LOCAL_VER" != "$NPM_VER" ]; then
              echo "Unpublished: $PKG_NAME $NPM_VER -> $LOCAL_VER"
              UNPUBLISHED=true
            fi
          done

          if [ "$CHANGESET_FILES" -gt 0 ] || [ "$UNPUBLISHED" = "true" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Release needed: changeset_files=$CHANGESET_FILES, unpublished=$UNPUBLISHED"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No release needed — skipping."
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 2: Release — environment-gated, only when check says yes
  # ──────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Generate CI bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Run Kit SDK tests (1809 tests)
        working-directory: sdk/kit
        run: pnpm test

      - name: Run Platform tests (17 tests)
        working-directory: sdk/platform
        run: pnpm test

      - name: Run Custody adapter tests (96 tests)
        working-directory: sdk/custody
        run: pnpm test

      - name: Run Plugin tests
        working-directory: packages/plugins
        run: pnpm test

      # ── Deploy↔publish lockstep guard (B) ────────────────────────────────
      # @usesigil/kit's TA-19 digest encoder (compute-policy-preview-digest.ts)
      # is lockstep-coupled to the on-chain program's POLICY_PREVIEW_FIELD_COUNT.
      # Publishing kit while the deployed devnet program still lags its digest
      # contract breaks queue_policy_update with PolicyPreviewMismatch (6071).
      # This is the 0.18.0 incident: kit went 22→24 fields and published BEFORE
      # the program redeploy landed.
      #
      # deploy-devnet.yml is path-filtered to programs/sigil/src/** + Anchor.toml,
      # so the "version packages" merge (no program change) does NOT trigger a
      # deploy — the latest 'Deploy to Devnet' run therefore reflects the program
      # state kit is built against (no race with a concurrent re-deploy).
      #
      # Gate ONLY when kit is actually publishing (local version ahead of npm),
      # so plugins/custody/platform-only releases are unaffected. Fail-closed: if
      # the deploy isn't green, block and re-run Release (workflow_dispatch) once
      # the deploy lands.
      - name: Lockstep guard — kit must not publish ahead of the devnet program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL=$(node -p "require('./sdk/kit/package.json').version")
          NPM=$(npm view @usesigil/kit version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$NPM" ]; then
            echo "kit $LOCAL already on npm — kit is not publishing in this run; lockstep guard N/A."
            exit 0
          fi
          echo "kit will publish $NPM -> $LOCAL; verifying the devnet program deploy is green..."
          STATUS=$(gh run list --workflow=deploy-devnet.yml --branch main --limit 1 --json status --jq '.[0].status')
          CONCL=$(gh run list --workflow=deploy-devnet.yml --branch main --limit 1 --json conclusion --jq '.[0].conclusion')
          echo "latest 'Deploy to Devnet' on main: status=${STATUS:-none} conclusion=${CONCL:-none}"
          if [ "$CONCL" != "success" ]; then
            echo "::error::Refusing to publish @usesigil/kit $LOCAL — latest 'Deploy to Devnet' on main is status=${STATUS:-none} conclusion=${CONCL:-none} (need conclusion=success)."
            echo "The deployed devnet program may not match kit's digest contract; clients would hit PolicyPreviewMismatch (6071) on queue_policy_update."
            echo "Fix: make 'Deploy to Devnet' green for the current program (re-run it if it failed on a flaky post-deploy test — see PR #347), then re-run this Release via workflow_dispatch."
            exit 1
          fi
          echo "Latest devnet deploy is green — kit/program digest lockstep OK."

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          # GITHUB_TOKEN for PR creation/updates (has pull-requests: write).
          # Git push uses the app token from checkout (triggers CI on the PR).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
